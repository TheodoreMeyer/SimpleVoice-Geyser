plugins {
    id 'java'
    id 'java-library'
    id 'com.gradleup.shadow' version '9.4.0'
}

repositories {
    maven {
        url = uri('https://nexus.velocitypowered.com/repository/maven-public/')
    }
}

dependencies {
    compileOnly("com.velocitypowered:velocity-api:${velocity_api_version}")
    annotationProcessor("com.velocitypowered:velocity-api:${velocity_api_version}")

    implementation("org.json:json:20250107")
    implementation("org.mindrot:jbcrypt:0.4")
    implementation("org.eclipse.jetty:jetty-server:11.0.25")
    implementation("org.eclipse.jetty:jetty-servlet:11.0.25")
    implementation("org.eclipse.jetty.websocket:websocket-servlet:11.0.25")
    implementation("org.eclipse.jetty.websocket:websocket-jetty-server:11.0.25")
}

tasks.processResources {
    inputs.property("version", version)

    filesMatching('velocity-plugin.json') {
        expand(
                plugin_version: version
        )
    }

    from(project(":core").layout.projectDirectory.dir("web")) {
        into("web")
        filesMatching("index.html") {
            filter { line ->
                line.replace(
                        "@@GIT_COMMIT@@",
                        currentGitCommit()
                )
            }
        }
    }
}

tasks.shadowJar {
    archiveClassifier.set("")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    rootProject.applySvgRelocations(delegate)
}

tasks.withType(Jar).configureEach {
    archiveBaseName.set("Svg-Velocity")
}

tasks.jar {
    enabled = false
}

//-----------
//Build Identifier
//-----------
def currentGitCommit() {
    try {
        return providers.exec {
            commandLine("git", "rev-parse", "--short", "HEAD")
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        return "unknown"
    }
}

// BuildInfo.java generation
tasks.register("generateBuildInfo") {

    def outputDir = layout.buildDirectory.dir("generated/sources/buildinfo")

    outputs.dir(outputDir)

    inputs.property("gitCommit", currentGitCommit())

    doLast {
        def gitCommit = currentGitCommit()

        def file = outputDir.get()
                .file("io/github/theodoremeyer/simplevoicegeyser/velocity/BuildInfo.java")
                .asFile

        file.parentFile.mkdirs()

        file.text = """
package io.github.theodoremeyer.simplevoicegeyser.velocity;

/**
 * Auto-generated build metadata for the Velocity proxy module.
 */
public final class BuildInfo {

    private BuildInfo() {}

    /**
     * Git commit hash used for this build.
     */
    public static final String BUILD_ID = "${gitCommit}";

    /**
    * Project version used for this build.
    */
    public static final String PROJECT_VERSION = "${project.version}";
}
"""
    }
}

// make Gradle compile generated source
sourceSets.main.java.srcDir(
        layout.buildDirectory.dir("generated/sources/buildinfo")
)

tasks.compileJava.dependsOn(tasks.generateBuildInfo)
