plugins {
    id 'java'
    id 'java-library'
    id 'com.gradleup.shadow' version '9.4.0' // ShadowJar
    id "xyz.jpenilla.run-paper" version "3.0.2"
}

repositories {
    maven {
        url = uri('https://hub.spigotmc.org/nexus/content/groups/public/')
    }
}

dependencies {
    // Spigot API — Folia EntityScheduler is used at runtime via reflection (see EntityThreadAccess)
    compileOnly("org.spigotmc:spigot-api:${spigot_api_version}-R0.1-SNAPSHOT")

    // CORE MODULE
    implementation(project(":core"))

    // Logging
    implementation("org.slf4j:slf4j-jdk14:2.0.16")

    // Simple Voice Chat API
    compileOnly("de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}")
}

tasks.processResources {
    inputs.property("version", version)
    inputs.property("spigot_version", spigot_api_version)

    filesMatching('plugin.yml') {
        expand(
                plugin_version: version,
                spigot_version: spigot_api_version
        )
    }
}

tasks.shadowJar {

    archiveClassifier.set("") // no -all suffix
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    rootProject.applySvgRelocations(delegate)

    // Include core classes + resources
    from(project(":core").sourceSets.main.output)

}
tasks.withType(Jar).configureEach {
    archiveBaseName.set("Svg-Spigot")
}


tasks.jar {
    enabled = false
}

tasks.runServer { // https://github.com/jpenilla/run-task/wiki
    minecraftVersion("26.3")
    downloadPlugins {
        // Simple Voice Chat (2.6.24 adds explicit Paper 26.3 support)
        url("https://cdn.modrinth.com/data/9eGKb6K1/versions/EJth3OAr/voicechat-bukkit-2.6.24.jar")
        // Geyser //
        url("https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot")
        // Floodgate //
        url("https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot")
        // ViaVersion — protocol bridge for mixed Java/Bedrock clients on Paper 26.3
        url("https://cdn.modrinth.com/data/P1OZGk5p/versions/vd9B8ESF/ViaVersion-5.12.2-SNAPSHOT.jar")
        // ViaBackwards — older client protocols when harness runs on latest MC
        url("https://cdn.modrinth.com/data/NpvuJQoq/versions/dWw67APC/ViaBackwards-5.12.1.jar")
    }
}
