client:

  # default: 60
  # Seconds a web/Svg-App client may wait after a valid password before the
  # player must appear online in Minecraft (and Simple Voice Chat) to finish join.
  vctimeout: 60

  # default: 2
  # Idle websocket timeout in minutes
  idletimeout: 2

  # default: false
  # Only allow bedrock players to join the chat
  requireBedrock: false

  # default: true
  # Allows bedrock clients to open the SVG menu via emotes.
  # WARNING: Make sure off-hand-emote is disabled in Geyser to avoid conflicts.
  useEmoteForSVG: true

  # default: true
  # When true, Svg-App must send clientType.serverVersion equal to this plugin version.
  # When false, the same major.minor is accepted (any patch) as a temporary escape hatch.
  require-latest: true

  web:
    # default: en
    # Default UI language when the visitor has no saved preference (en, nl, pl, it, es).
    default-language: en

    # default: Simple Voice Chat
    # Display name on the join page / browser title.
    server-name: "Simple Voice Chat"

    # default: empty
    # Optional short subtitle under the server name.
    tagline: ""

  # default: true
  # Allows players using web-chat to chat in-game
  web-chat-enabled: true

  join-message:

    #default: true
    # Enables join messages for web clients.
    enabled: true

    # Default: provided below
    # The text svg sends when a player joins
    text:
      - "This Server Uses SimpleVoice-Geyser."
      - "To set it up, run /svg pswd [password],"
      - "Then join Via the server's SVG website."


  allowedTypes:

    # default: true
    # When true, listed client types are blocked. When false, only listed client types are allowed.
    isBlackList: true

    # default: no client types listed
    # Client type names to use with the blacklist/whitelist mode above.
    # Uncomment one or both entries below when using blacklist/whitelist mode.
    list:
      # - Web
      # - Svg-App

server:

  group:

    # Settings for the default group for SVG web players.
    default:

      # default: false
      # When true, all web/SVG clients join one shared OPEN group named "Svg" (party line).
      # Leave false for normal Simple Voice Chat proximity (recommended).
      enabled: false

      # default: 1a2b
      # Controls the default group's password.
      password: 1a2b

      # default: false
      # Force assigning the default SVG group even when a user already has a group.
      force-on-web-join: false

  # default: 8080
  # Port server will run on.
  port: 8080

  # default: 0.0.0.0
  # Address server binds to; use 127.0.0.1 to only allow host-local access.
  bind-address: 0.0.0.0

  # default: /
  # Context path for hosting SVG web UI behind proxies/subpaths.
  context-path: /

  audio:

    # default: auto
    # Audio transport preference: auto | legacy | svg-v2
    transport-mode: auto

    # default: true
    # During migration, fallback to legacy transport for incompatible clients.
    allow-legacy-fallback: true

    mic:
      # default: true
      # Allow PCM microphone uploads for older clients, including SVG-App 1.0.2.
      # Set false to require an Opus-capable microphone client, independently of receive mode.
      allowLegacy: true

# default: false
# Debug logs
# Do NOT use this in production. This will very quickly fill up your server logs.
debug: false

# default: true
# Check for plugin updates on startup.
updatechecker:
  enable: true

# Config file backups (written under plugins/SimpleVoice-Geyser/backups/configs/)
config:
  backups:
    # default: true
    # Create a backup before auto-updating config.yml with new keys / version.
    enabled: true

    # default: 6
    # Max backups to keep. Oldest files are deleted first. Use 0 for unlimited.
    max-files: 6

# default: 0.1.1-dev-migration1
# Internal config schema marker used for migration tracking.
config-version: 0.1.1-dev-migration1
